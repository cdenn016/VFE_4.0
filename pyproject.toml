[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfe4"
version = "0.1.0"
description = "VFE 4.0 deterministic H1 verification foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mpmath>=1.3",
    "numpy",
    "torch",
]

[project.optional-dependencies]
wt103 = [
    "matplotlib==3.10.6",
    "tiktoken==0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vfe4*"]
